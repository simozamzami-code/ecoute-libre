name: Sonora
options:
  bundleIdPrefix: fr.sonora
  deploymentTarget:
    iOS: '16.0'
  createIntermediateGroups: true
packages:
  YouTubeKit:
    url: https://github.com/b5i/YouTubeKit.git
    revision: 6532af39da4c1612b0a1af603792419d8fb0e67f
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '16.0'
    TARGETED_DEVICE_FAMILY: '1'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
targets:
  Sonora:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Info.plist
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Sonora
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleURLTypes:
          - CFBundleURLName: fr.sonora.audio
            CFBundleURLSchemes: [sonora]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.sonora.audio.ios
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: true
    dependencies:
      - package: YouTubeKit
  SonoraTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.sonora.audio.tests
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: Sonora
schemes:
  Sonora:
    build:
      targets:
        Sonora: all
    test:
      targets: [SonoraTests]
